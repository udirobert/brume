[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"

[build.environment]
  # Prevent Netlify from failing on RevenueCat publishable keys (these are public by design)
  SECRETS_SCAN_OMIT_KEYS = "VITE_REVENUECAT_ANDROID_KEY"
  NODE_VERSION = "24"
  PNPM_VERSION = "12.14.0"
  VITE_APP_ENV = "production"

# Note: API calls go directly to Hetzner server
# Single frontend architecture - no functions needed

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=self, microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
